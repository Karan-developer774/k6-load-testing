services:
  postgres:
    image: postgres:16-alpine
    container_name: k6_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: k6loadtest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: k6_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: k6_backend
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/k6loadtest?schema=public"
      ALLOW_LOCAL_TARGETS: "false"
      MAX_VUS_CAP: 5000
      MAX_DURATION_SECONDS: 3600
      MAX_CONCURRENT_TESTS: 5
      JWT_SECRET: "k6-load-testing-super-secret-key-production"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: k6_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
